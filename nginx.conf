# T2-28 — nginx sirve la SPA y hace de proxy de la API.
#
# Que el proxy esté aquí no es comodidad: pone frontend y backend **en el mismo origen**,
# y de eso depende cómo pueden ser las cookies de sesión. Con dos orígenes distintos hay
# que emitirlas `SameSite=None`, que obliga a `Secure` y por tanto a TLS, y las expone a
# ser enviadas en peticiones de terceros. Detrás de este proxy basta con `SameSite=Lax`,
# que es lo que hace la pila del compose.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con hash en el nombre no cambian nunca: se pueden cachear para
    # siempre. El `index.html` no, o el navegador seguiría pidiendo el build anterior.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # La API. `proxy_pass` sin barra final conserva la ruta completa, así que
    # `/api/v1/products` llega al backend tal cual.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las exportaciones se transmiten por partes (T2-05): con el búfer activado,
        # nginx acumularía el archivo entero antes de mandarlo y desharía el streaming.
        proxy_buffering off;
    }

    # Enrutado de la SPA: cualquier ruta que no sea un archivo se resuelve con el
    # `index.html` y la decide React Router. Sin esto, recargar en `/catalog/products`
    # devuelve un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

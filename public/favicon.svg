<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Stockly">
  <!--
    Icono de Stockly. Es el mismo cubo de Heroicons que la cabecera usa como marca
    (`CubeIcon` en `src/App.tsx`): el icono de la pestaña y el de la aplicación tienen
    que ser el mismo dibujo, o la pestaña no se reconoce entre veinte.

    Va sobre baldosa rellena y no como trazo suelto: a 16 px, un contorno sobre el fondo
    del navegador desaparece, y además ese fondo cambia con el tema del sistema operativo
    —el icono no puede contar con él—. La baldosa se pinta con el acento **fuerte** del
    sistema de diseño (#047857) y no con el normal: blanco sobre el acento normal da
    3.77:1, y la regla reserva el fuerte para los rellenos con algo encima. Los colores
    van literales a propósito; este archivo lo sirve el navegador antes de que exista
    ninguna hoja de estilos, así que aquí no hay variables de tema que valgan.
  -->
  <rect width="24" height="24" rx="5" fill="#047857" />
  <g transform="translate(12 12) scale(.66) translate(-12 -12)">
    <path
      d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.1"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>

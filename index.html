<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      T3-12 — aplicación privada: nada de esto debe aparecer en un buscador.
      Acompaña al `Disallow: /` de `public/robots.txt` y cubre el caso que aquel no
      puede: un rastreador que llegue a la página igualmente. Ver el comentario de ese
      archivo, que explica por qué hacen falta los dos y no solo uno.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Stockly — Gestión de inventario</title>
    <meta
      name="description"
      content="Stockly es un sistema de gestión de inventario: controla productos, stock, órdenes de compra y venta, reportes y alertas de bajo stock."
    />
    <!--
      T4-11 — el tema elegido, aplicado antes del primer pintado.

      Tiene que ser un script en línea y bloqueante: `main.tsx` es un módulo, o sea diferido,
      y para cuando se ejecuta el navegador ya ha pintado. Quien haya elegido un tema
      distinto al de su sistema vería un fogonazo del otro en cada carga, que es justo lo que
      el selector existe para evitar.

      Sí, duplica tres literales de `src/shared/lib/tema.ts` —la clave, y los dos valores que
      llevan atributo—. No hay forma de importar desde aquí sin volver a diferirlo, así que
      lo que hay es una guardia: `src/tests/tema.test.ts` compara este bloque con el módulo y
      falla si se separan.

      El `try` es por el almacenamiento bloqueado (Safari privado, cookies desactivadas en un
      iframe): `localStorage` **lanza** en vez de devolver null. Sin él, no arrancaría nada.
    -->
    <script>
      try {
        var tema = localStorage.getItem("stockly:tema");
        if (tema === "claro" || tema === "oscuro") {
          document.documentElement.dataset.tema = tema;
        }
      } catch (e) {
        /* Sin preferencia legible se usa `auto`, que es no poner atributo. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
